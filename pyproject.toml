[project]
name = "halley"
version = "0.1.0"
description = "Actuarial projection engine in Python: models are checked before they run and compiled when they do."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Sahil Haridas" }]
requires-python = ">=3.12"
keywords = ["actuarial", "insurance", "projection", "cash flow", "IFRS 17"]
classifiers = [
    "Development Status :: 1 - Planning",
    "Intended Audience :: Financial and Insurance Industry",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.12",
    "Topic :: Office/Business :: Financial",
    "Topic :: Scientific/Engineering :: Mathematics",
]
dependencies = [
    # NumPy reference backend: the executable spec every other backend is tested against (D16).
    "numpy>=2.0",
    # Parquet / Arrow in and out (D20).
    "pyarrow>=17",
    # Rate[Annual] defaults its compounding tag to Effective (PEP 696); Python 3.12 evaluates
    # the annotation at build time, so the TypeVar default needs typing_extensions at run time.
    "typing-extensions>=4.12",
]

[project.optional-dependencies]
# The multicore CPU backend (D16): pip install halley[numba].
numba = ["numba>=0.61"]

[project.urls]
Homepage = "https://halley.kndra.co.za"
Documentation = "https://halley.kndra.co.za"

[dependency-groups]
dev = [
    "pytest>=8.3",
    # Property-based tests over the model point schema (D24).
    "hypothesis>=6.100",
    "ruff>=0.6",
    # Units are typed operator overloads; pyright flags mismatches in the editor before a build.
    "pyright>=1.1.380",
    # The reference spreadsheets (D22) are written with openpyxl and recalculated in Excel on
    # Windows through COM (pywin32) so that their cached values can be read back by the tests.
    "openpyxl>=3.1",
    "pywin32>=306; sys_platform == 'win32'",
    # The Numba backend (M6) is tested against the NumPy reference (D16).
    "numba>=0.61",
]
# Reference case 2 (D23) reconciles to lifelib's BasicTerm_ME. lifelib (MIT) runs on modelx
# (GPL-3.0); neither is a dependency of halley or of the test suite, which reads the committed
# fixtures under tests/data/lifelib. This group regenerates them (tests/data/lifelib/README.md)
# and lets test_lifelib_basic_term.py check them against a live lifelib run.
lifelib = [
    "lifelib>=0.17.2",
    "modelx>=0.33",
    "pandas>=2.2",
    "openpyxl>=3.1",
]
# The site at halley.kndra.co.za. MyST keeps the specs in Markdown; Furo is the theme.
docs = [
    "sphinx>=8.1",
    "myst-parser>=4.0",
    "furo>=2024.8.6",
]

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "N", "C4", "PT", "T20"]

[tool.ruff.lint.per-file-ignores]
# The spec's number generator prints its results as long report lines, and names the batch
# horizon H as the spec does.
"docs/spec/term_assurance_numbers.py" = ["T20", "E501", "N803", "N806"]
# The input writer reports what it wrote.
"docs/spec/term_assurance_inputs.py" = ["T20"]
# The in-force group worked example prints its report the same way and names the horizon T,
# the scenario count J and the IFRS 17 symbols as its document does.
"docs/spec/in_force_group_numbers.py" = ["T20", "E501", "N803", "N806"]
# The lifelib fixture generator reports what it wrote and the versions it ran.
"tests/data/lifelib/make_reference.py" = ["T20"]
# The reference workbook builders and the Excel recalculation tool report what they wrote.
"docs/spec/*_workbook.py" = ["T20"]
"docs/spec/recalc_excel.py" = ["T20"]
# The in-force input writer reports what it wrote.
"docs/spec/in_force_group_inputs.py" = ["T20"]
"docs/spec/annuity_inputs.py" = ["T20"]

[tool.ruff.format]
line-ending = "lf"
# The spec's and README's authoring sketches are laid out for reading, not formatted as source.
exclude = ["README.md", "docs/**/*.md"]

[tool.pyright]
include = ["src", "tests"]
extraPaths = ["src", "tests"]
pythonVersion = "3.12"
typeCheckingMode = "strict"

[tool.pytest.ini_options]
testpaths = ["tests"]
# --strict-markers: an unregistered marker is an error. -rs: every skip prints its reason.
# The default run includes the Numba backend's differentials (D16); -m "not numba" leaves them
# out on request (README, Development).
addopts = "--strict-markers -rs"
markers = [
    "numba: the Numba backend against the NumPy reference (D16); a first run compiles every kernel",
]
